[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "verithra"
version = "0.1.0"
description = "Technical support answers grounded in local documentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0,<2", "openai>=2,<3", "numpy>=1.26,<3", "faiss-cpu>=1.9,<2",
    "streamlit>=1.45,<2"
]

[project.scripts]
verithra = "verithra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
